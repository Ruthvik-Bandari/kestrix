title: Script execution via rundll32 or regsvr32
id: 8c5e2d1a-0000-4000-8000-000000000007
status: test
level: high
logsource:
  category: process_creation
  product: windows
detection:
  sel_rundll:
    Image|endswith: \rundll32.exe
    CommandLine|contains: 'javascript:'
  sel_regsvr:
    Image|endswith: \regsvr32.exe
    CommandLine|contains: /i:http
  condition: sel_rundll and sel_regsvr
