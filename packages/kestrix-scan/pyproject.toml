[project]
name = "kestrix-scan"
version = "0.1.0"
description = "Kestrix code scanner: local, zero-dependency security checks for Python code, hard-coded secrets and dependency lockfiles (offline OSV), with SARIF, pre-commit, pytest and a Claude Code plugin."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ruthvik Bandari", email = "bandari.ru@northeastern.edu" }]
requires-python = ">=3.10"
keywords = ["security", "sast", "sca", "osv", "secrets", "static-analysis", "cwe", "sarif", "pre-commit", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
# Zero runtime dependencies on Python 3.11 and newer (ADR 0006); 3.10 needs tomli to read pyproject.toml.
dependencies = ['tomli>=2; python_version < "3.11"']

[project.scripts]
kestrix-scan = "kestrix_scan.cli:main"

[project.entry-points.pytest11]
kestrix = "kestrix_scan.pytest_plugin"

[project.urls]
Repository = "https://github.com/Ruthvik-Bandari/kestrix"
Documentation = "https://github.com/Ruthvik-Bandari/kestrix/blob/main/packages/kestrix-scan/README.md"
Changelog = "https://github.com/Ruthvik-Bandari/kestrix/blob/main/packages/kestrix-scan/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kestrix_scan"

[dependency-groups]
# For `uv run --package kestrix-scan pytest packages/kestrix-scan/tests` (the CI matrix); never published.
dev = ["pytest>=9"]
