name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run mypy --python-version 3.13

  python-tests:
    name: Python tests (${{ matrix.python }})
    needs: python-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      - name: Unit tests of both packages (engine tests skip without Elasticsearch)
        run: uv run pytest -m "not engine" --cov=kestrix --cov=kestrix_scan --cov-report=term-missing

  scan-tests:
    name: kestrix-scan tests alone (${{ matrix.python }})
    needs: python-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install only kestrix-scan and pytest (no workbench dependencies)
        run: uv sync --locked --package kestrix-scan
      - run: uv run --package kestrix-scan pytest packages/kestrix-scan/tests

  engine-tests:
    name: Replay tests on pinned Elasticsearch
    needs: python-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.3@sha256:bbac63ecd50e9263565fbb616172a5287d5f99e486d76453e81e32cafcba3838
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms1g -Xmx1g
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run pytest -m engine -v
        env:
          KESTRIX_ES_URL: http://127.0.0.1:9200

  security:
    name: Self-scan and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --all-extras
      # Blocking: the committed code has no findings, so any new one is a regression to fix or to suppress
      # with a written reason (an unreviewed suppression comment suppresses nothing).
      - name: kestrix-scan on Kestrix's own code
        run: uv run kestrix-scan src frontend/src scripts research/scripts tests/fixtures docs/demo/record.md packages --fail-on low
      # Blocking: these are the packages the container image ships. A new advisory can fail an unrelated
      # pull request; the fix is a lockfile bump (`uv lock --upgrade-package <name>`) or, with no fix
      # upstream, an --ignore-vuln entry here with the reason beside it.
      #   PYSEC-2026-2447: diskcache (pysigma's cache; no fixed release; the detect module is not served
      #   by the hosted service and Kestrix never points it at an untrusted cache directory).
      - name: Python runtime dependencies (audit)
        run: |
          uv export --frozen --no-dev --extra hosted --no-emit-workspace --format requirements-txt --output-file "$RUNNER_TEMP/runtime-requirements.txt" > /dev/null
          uvx --from pip-audit==2.10.1 pip-audit -r "$RUNNER_TEMP/runtime-requirements.txt" --no-deps --disable-pip --ignore-vuln PYSEC-2026-2447
      - run: npm ci --ignore-scripts
        working-directory: frontend
      # Blocking: runtime packages are bundled into the dashboard that visitors run.
      - name: Dashboard runtime dependencies (audit)
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      # Non-blocking: build and test tools never reach a visitor or the container; advisories for them
      # are tracked here and fixed on the next dependency bump rather than blocking unrelated work.
      - name: Dashboard build tools (audit, report only)
        run: npm audit --audit-level=high
        working-directory: frontend
        continue-on-error: true
      - name: Python development dependencies (audit, report only)
        run: |
          uv export --frozen --all-extras --all-groups --no-emit-workspace --format requirements-txt --output-file "$RUNNER_TEMP/all-requirements.txt" > /dev/null
          uvx --from pip-audit==2.10.1 pip-audit -r "$RUNNER_TEMP/all-requirements.txt" --no-deps --disable-pip
        continue-on-error: true

  frontend:
    name: Dashboard lint, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  package:
    name: Build both wheels and smoke-test them
    needs: [python-tests, scan-tests, frontend, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: npm --prefix frontend ci && npm --prefix frontend run build
      - name: The built dashboard runs under the strict CSP (no inline script, style or handler)
        run: |
          uv sync --locked --all-extras
          uv run pytest -q tests/server/test_site_hardening.py
      - run: uv build --all-packages
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: kestrix-scan installs with zero dependencies into a clean venv
        run: |
          python -m venv /tmp/scan
          /tmp/scan/bin/python -m pip install --dry-run --ignore-installed --report /tmp/scan-report.json dist/kestrix_scan-*.whl
          python -c "import json; names = [i['metadata']['name'] for i in json.load(open('/tmp/scan-report.json'))['install']]; assert names == ['kestrix-scan'], names"
          /tmp/scan/bin/python -m pip install --no-index dist/kestrix_scan-*.whl
          test "$(/tmp/scan/bin/python -m pip list --format freeze | grep -v '^pip==')" = "kestrix-scan==0.1.0"
          /tmp/scan/bin/kestrix-scan --version
          /tmp/scan/bin/python -m kestrix_scan rules > /dev/null
          printf 'import subprocess\nsubprocess.run(cmd, shell=True)\n' > /tmp/vulnerable.py
          status=0
          /tmp/scan/bin/kestrix-scan /tmp/vulnerable.py --format sarif --output /tmp/scan.sarif || status=$?
          test "$status" -eq 1
          /tmp/scan/bin/kestrix-scan install-claude-plugin --dest /tmp/kestrix-plugin
          test -f /tmp/kestrix-plugin/.claude-plugin/plugin.json && test -f /tmp/kestrix-plugin/hooks/kestrix_hook.py
      - name: Install the workbench wheel in a clean environment and run the CLI
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/kestrix version
          /tmp/smoke/bin/kestrix code scan --help
          /tmp/smoke/bin/kestrix detect cases
          /tmp/smoke/bin/kestrix bitcoin scan bc1qar0srrr7xfkvy5l643lydnw9re59gtzzwf5mdq
          /tmp/smoke/bin/python -c "import zipfile,glob; names=zipfile.ZipFile(glob.glob('dist/kestrix-*.whl')[0]).namelist(); assert any(n.endswith('server/static/index.html') for n in names), 'dashboard missing from wheel'"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  container:
    name: Build and smoke-test the hosted container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image (not pushed)
        run: docker build --pull -t kestrix:ci .
      - name: Refuse to start without hosted configuration
        run: |
          status=0
          docker run --rm --read-only --tmpfs /tmp kestrix:ci || status=$?
          test "$status" -eq 2
      - name: Run read-only, non-root, with dummy credentials, and probe it
        env:
          HOST: kestrix.ci.invalid
        run: |
          docker volume create kestrix-ci-data
          docker run -d --name kestrix-ci --read-only --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            --cap-drop ALL --security-opt no-new-privileges \
            -v kestrix-ci-data:/data -p 127.0.0.1:8000:8000 \
            -e KESTRIX_PUBLIC_ORIGIN="https://$HOST" \
            -e KESTRIX_SESSION_PEPPER=ci-only-pepper-not-a-secret-0123456789abcdef \
            -e KESTRIX_JWT_SECRET=ci-only-jwt-secret-not-a-secret-0123456789abcdef \
            -e KESTRIX_HISTORY_KEY=Y2ktb25seS1oaXN0b3J5LWtleS1ub3QtYS1zZWNyZXQ= \
            -e KESTRIX_GITHUB_CLIENT_ID=ci-dummy-id -e KESTRIX_GITHUB_CLIENT_SECRET=ci-dummy-secret \
            kestrix:ci
          for _ in $(seq 30); do
            curl -fsS -H "Host: $HOST" http://127.0.0.1:8000/api/health > health.json && break
            sleep 1
          done
          cat health.json
          python3 -c "import json; h = json.load(open('health.json')); assert h['mode'] == 'hosted', h; assert h['modules'] == ['forensics', 'webcheck', 'mail'], h"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health)" = 421
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Host: $HOST" http://127.0.0.1:8000/api/detect/cases)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Host: $HOST" http://127.0.0.1:8000/)" = 200
          curl -fsS -o /dev/null -D headers.txt -H "Host: $HOST" http://127.0.0.1:8000/api/health
          grep -qi '^strict-transport-security: max-age=63072000' headers.txt
          test "$(docker exec kestrix-ci id -u)" = 10001
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' kestrix-ci)" = true
          if docker exec kestrix-ci python -c "open('/opt/kestrix/probe', 'w')"; then
            echo "root filesystem is writable" >&2
            exit 1
          fi
          docker exec kestrix-ci python -c "import os; assert os.path.isfile('/data/kestrix.db')"
      - name: Deploy preflight, dry run, inside the production image
        # The script reads no secret and writes nothing outside a temporary directory. For a real go-live it
        # runs the same way with the real environment (docs/deploy.md, "Go-live checklist").
        run: docker exec -i kestrix-ci python - --dry-run < scripts/deploy_preflight.py
      - name: Container logs
        if: always()
        run: docker logs kestrix-ci || true
