#
# Release: on a v* tag, build kestrix-scan and kestrix, attest their provenance, and publish both to
# PyPI with trusted publishing (OIDC; no API token is stored anywhere). One-time PyPI setup and the
# release steps are in docs/release.md. Every action is pinned to a full commit SHA; the tag each
# SHA was resolved from (gh api repos/<owner>/<repo>/commits/<tag>) is in the comment beside it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and attest both packages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # to sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: The tag matches both package versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for file in pyproject.toml packages/kestrix-scan/pyproject.toml; do
            version="$(sed -n 's/^version = "\(.*\)"$/\1/p' "$file" | head -1)"
            test "v$version" = "$TAG" || { echo "$file has version $version, tag is $TAG" >&2; exit 1; }
          done
      - name: Build the dashboard bundled in the kestrix wheel
        run: npm --prefix frontend ci --ignore-scripts && npm --prefix frontend run build
      - run: uv build --all-packages
      - name: Check the wheels
        run: |
          python3 -c "import zipfile,glob; names=zipfile.ZipFile(glob.glob('dist/kestrix-*.whl')[0]).namelist(); assert any(n.endswith('server/static/index.html') for n in names), 'dashboard missing'"
          python3 -c "import zipfile,glob; names=zipfile.ZipFile(glob.glob('dist/kestrix_scan-*.whl')[0]).namelist(); assert any(n.endswith('.claude-plugin/plugin.json') for n in names), 'plugin missing'"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # One job per project, each in its own environment: a trusted-publishing token is minted for the one
  # PyPI publisher that matches the job's environment, so one job cannot upload both projects.
  publish-scan:
    name: Publish kestrix-scan to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi-scan
      url: https://pypi.org/project/kestrix-scan/
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: mkdir dist-scan && mv dist/kestrix_scan-* dist-scan/ && ls dist-scan
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist-scan/

  publish:
    name: Publish kestrix to PyPI
    needs: publish-scan # kestrix pins kestrix-scan==<version>, so kestrix-scan goes first.
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/kestrix/
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: mkdir dist-kestrix && mv dist/kestrix-* dist-kestrix/ && ls dist-kestrix
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist-kestrix/
